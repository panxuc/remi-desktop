<!doctype html>
<meta charset="utf-8" />
<title>Remi</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #root { position: fixed; inset: 0; }

  /* The renderer appends its own element — a canvas for spine, an <img> for gif — so style
     whatever it is. `pointer-events: none` is not optional: the element is full-bleed, and
     without it #root never sees the mousedown that starts a window drag (plan §5.1). */
  #root > * {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Debug caption for the M2 state keys. Invisible until something is shown. */
  #debug-label {
    position: fixed;
    left: 0; right: 0; bottom: 6px;
    font: 500 11px/1.4 ui-sans-serif, system-ui, sans-serif;
    text-align: center;
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 8px #000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 240ms ease;
  }
  #debug-label.visible { opacity: 1; }
</style>
<div id="root" data-tauri-drag-region></div>
<div id="debug-label"></div>
<script src="./vendor/spine-webgl.js"></script>
<script type="module" src="./app.js"></script>
