[package]
name = "remi-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
remi-core = { path = "../remi-core" }
tauri = { version = "2.11.5", features = ["macos-private-api"] }

[build-dependencies]
tauri-build = "2.6.3"

# tauri / tauri-build are added on the Mac — they stay local to this crate, since nothing
# else in the workspace may depend on them. Keeping remi-core free of any UI crate is what
# lets the GUI toolkit be swapped (e.g. to egui) without touching the logic.
