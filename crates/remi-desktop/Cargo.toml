[package]
name = "remi-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
remi-core = { path = "../remi-core" }
tauri = { version = "2.11.5", features = ["macos-private-api"] }

directories.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Only this crate reads config.toml, so `toml` stays local rather than hoisted to the workspace.
toml = "1.1.6"

[build-dependencies]
tauri-build = "2.6.3"

# tauri / tauri-build are added on the Mac — they stay local to this crate, since nothing
# else in the workspace may depend on them. Keeping remi-core free of any UI crate is what
# lets the GUI toolkit be swapped (e.g. to egui) without touching the logic.

[features]
# Whether the GIF fallback's art is staged into `ui/` and therefore embedded in the binary.
#
# Off by default: it is 8.5 MiB, 26% of the build, for a render path M1 and M2 between them
# showed macOS does not need. `ui/renderer/gif.js` itself ships either way — it is 40 lines, and a
# seam with one implementation is not a seam. This feature is only about the art.
#
# Turn it on if WebView2 turns out not to composite a transparent WebGL canvas at M6, which is the
# one place the fallback's original justification is still unresolved.
gif-fallback = []
