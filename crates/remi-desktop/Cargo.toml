[package]
name = "remi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
remi-core = { path = "../remi-core" }
# `tray-icon` is an optional feature rather than part of the default set, so without it listed the
# whole `tauri::tray` module simply does not exist. `image-png` is what `Image::from_bytes` is
# gated on, and the menu bar glyph is a PNG.
tauri = { version = "2.11.5", features = [
    "macos-private-api",
    "tray-icon",
    "image-png",
] }

directories.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Only this crate reads config.toml, so `toml` stays local rather than hoisted to the workspace.
toml = "1.1.6"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# tauri / tauri-build are added on the Mac — they stay local to this crate, since nothing
# else in the workspace may depend on them. Keeping remi-core free of any UI crate is what
# lets the GUI toolkit be swapped (e.g. to egui) without touching the logic.

[features]
# Whether the GIF fallback's art is staged into `ui/` and therefore embedded in the binary.
#
# Off by default: it is 8.5 MiB, 26% of the build, for a render path the Spine renderer makes
# unnecessary wherever a transparent WebGL canvas composites. `ui/renderer/gif.js` itself ships
# either way — it is 40 lines, and a seam with one implementation is not a seam. This feature is
# only about the art. Turn it on for a platform whose webview cannot composite that canvas.
gif-fallback = []
