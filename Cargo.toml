[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["tools/spine-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Hoisted because the version agreement is load-bearing, not for tidiness:
# serde/serde_json/tokio all appear in `remi-core`'s *public* API, so a member on an
# incompatible version would fail to typecheck against types it already holds.
# clap and anyhow are here as the binary-crate pair, shared by remi-hook and remi-desktop.
[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1
